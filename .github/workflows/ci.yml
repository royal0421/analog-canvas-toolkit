name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Sync upstream symbols and schema
        run: python -m toolkit setup

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild and compare every project
        run: python -m toolkit regress --jobs 2
